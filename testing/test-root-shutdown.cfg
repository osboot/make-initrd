# [test]
# kickstart_disks = 2
# boot_disks = 2
# boot_cmdline = [
#     "rdacct=1",
#     "rdlog=console",
#     "rd-debug-udev=1",
#     "quiet",
#     "panic=0",
#     "root=LABEL=ROOT",
# ]

ignoredisk --drives=LABEL=SYSIMAGE
clearpart --all --initlabel --disklabel=mbr

part /boot --size=100% --fstype=ext4 --label=BOOT
part /     --size=60%  --fstype=ext4 --label=ROOT
part /var  --size=40%  --fstype=ext4 --label=DATA

liveimg --url=dir:///sysimage/

shutdown

%post --erroronfail --nochroot
	set -x

	# Locate make-initrd source/build directory
	src_srv=""
	for d in /mnt/sysimage/srv /sysimage/srv /srv; do
		if [ -d "$d/features/shutdown" ]; then
			src_srv="$d"
			break
		fi
	done

	if [ -z "$src_srv" ]; then
		echo "ERROR: cannot locate make-initrd source directory (tried /mnt/sysimage/srv, /sysimage/srv, /srv)" >&2
		exit 1
	fi

	# Configure make-initrd with shutdown feature and verification hook
	tee /mnt/sysimage/etc/initrd.mk.addon <<-EOF
	FEATURES += shutdown
	PUT_FILES += /lib/initrd/shutdown/shutdown.d/99-verify-shutdown.sh
	EOF

	# Install make-initrd-shutdown-restore and make-initrd-shutdown.service
	mkdir -p /mnt/sysimage/usr/sbin /mnt/sysimage/usr/lib/systemd/system
	if [ -x "$src_srv/.build/dest/usr/sbin/make-initrd-shutdown-restore" ]; then
		install -m 755 "$src_srv/.build/dest/usr/sbin/make-initrd-shutdown-restore" \
			/mnt/sysimage/usr/sbin/make-initrd-shutdown-restore
	else
		install -m 755 "$src_srv/utils/make-initrd-shutdown-restore/make-initrd-shutdown-restore.in" \
			/mnt/sysimage/usr/sbin/make-initrd-shutdown-restore
	fi
	install -m 644 "$src_srv/features/shutdown/system/make-initrd-shutdown.service" \
		/mnt/sysimage/usr/lib/systemd/system/make-initrd-shutdown.service

	mkdir -p /mnt/sysimage/usr/lib/systemd/system/sysinit.target.wants
	ln -sf ../make-initrd-shutdown.service \
		/mnt/sysimage/usr/lib/systemd/system/sysinit.target.wants/make-initrd-shutdown.service

	mkdir -p /mnt/sysimage/etc/systemd/system/sysinit.target.wants
	ln -sf /usr/lib/systemd/system/make-initrd-shutdown.service \
		/mnt/sysimage/etc/systemd/system/sysinit.target.wants/make-initrd-shutdown.service

	if command -v systemctl >/dev/null 2>&1; then
		systemctl --root=/mnt/sysimage enable make-initrd-shutdown.service 2>/dev/null || :
	fi

	# Ensure initrd-find, initrd-extract and initrd-ls are available on the target system for restore
	if [ -x "$src_srv/.build/dest/usr/sbin/initrd-find" ]; then
		install -m 755 "$src_srv/.build/dest/usr/sbin/initrd-find" \
			/mnt/sysimage/usr/sbin/initrd-find
	else
		install -m 755 "$src_srv/utils/initrd-find/initrd-find.in" \
			/mnt/sysimage/usr/sbin/initrd-find
	fi
	if [ -x "$src_srv/.build/dest/usr/sbin/initrd-extract" ]; then
		install -m 755 "$src_srv/.build/dest/usr/sbin/initrd-extract" \
			/mnt/sysimage/usr/sbin/initrd-extract
	fi
	if [ -x "$src_srv/.build/dest/usr/sbin/initrd-ls" ]; then
		install -m 755 "$src_srv/.build/dest/usr/sbin/initrd-ls" \
			/mnt/sysimage/usr/sbin/initrd-ls
	fi

	# Ensure libshell is available on the target system for initrd-find
	mkdir -p /mnt/sysimage/usr/bin
	if [ -d "$src_srv/.build/dest/usr/bin" ]; then
		cp -a "$src_srv/.build/dest/usr/bin"/shell-* /mnt/sysimage/usr/bin/ 2>/dev/null || :
	fi

	# Ensure cpio is present on the target rootfs
	if ! [ -x /mnt/sysimage/usr/bin/cpio ] && ! [ -x /mnt/sysimage/bin/cpio ]; then
		cpio_path="$(command -v cpio ||:)"
		if [ -n "$cpio_path" ]; then
			install -m 755 "$cpio_path" /mnt/sysimage/usr/bin/cpio
		fi
	fi

	# Verify essential files are installed
	test -x /mnt/sysimage/usr/sbin/make-initrd-shutdown-restore
	test -f /mnt/sysimage/usr/lib/systemd/system/make-initrd-shutdown.service

	# Create verification shutdown hook to validate clean exitrd teardown
	mkdir -p /mnt/sysimage/lib/initrd/shutdown/shutdown.d
	tee /mnt/sysimage/lib/initrd/shutdown/shutdown.d/99-verify-shutdown.sh <<-'EOF'
	#!/bin/sh
	# SPDX-License-Identifier: GPL-3.0-or-later

	if mountpoint -q /oldroot 2>/dev/null; then
		echo "SHUTDOWN VERIFY FAIL: /oldroot is still mounted!" >&2
		[ ! -w /dev/console ] || echo "SHUTDOWN VERIFY FAIL: /oldroot is still mounted!" > /dev/console
		exit 1
	fi

	echo "SHUTDOWN VERIFY SUCCESS: /oldroot cleanly unmounted"
	echo "IT WORKS!"
	[ ! -w /dev/console ] || echo "IT WORKS!" > /dev/console
	EOF
	chmod 755 /mnt/sysimage/lib/initrd/shutdown/shutdown.d/99-verify-shutdown.sh

	# Replace /init.once to initiate graceful systemd poweroff instead of immediate reboot -f
	tee /mnt/sysimage/init.once <<-'EOF'
	#!/bin/sh
	set -eu
	test -d /proc && mountpoint -q /proc || mount -t proc proc /proc
	test -d /sys && mountpoint -q /sys || mount -t sysfs sysfs /sys

	status="$(systemctl is-active make-initrd-shutdown.service 2>/dev/null || echo inactive)"
	echo "Init-once: make-initrd-shutdown service status: $status" > /dev/console
	systemctl status make-initrd-shutdown.service > /dev/console 2>&1 || :

	if [ "$status" != "active" ]; then
		echo "Init-once: starting make-initrd-shutdown.service..." > /dev/console
		systemctl start make-initrd-shutdown.service > /dev/console 2>&1 || :
		status="$(systemctl is-active make-initrd-shutdown.service 2>/dev/null || echo inactive)"
		echo "Init-once: make-initrd-shutdown service status after start: $status" > /dev/console
	fi

	echo "Init-once: initiating graceful system poweroff to trigger make-initrd exitrd..." > /dev/console
	systemctl poweroff --no-block
	exit 0
	EOF
	chmod 755 /mnt/sysimage/init.once
%end
