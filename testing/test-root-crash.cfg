# [test]
# kickstart_disks = 2
# boot_disks = 2
# boot_allow_reboot = true
# boot_cmdline = [
#     "rdacct=1",
#     "rdlog=console",
#     "rd-debug-udev=1",
#     "quiet",
#     "panic=0",
#     "root=LABEL=ROOT",
#     "crashkernel=256M",
# ]

ignoredisk --drives=LABEL=SYSIMAGE,vdc
clearpart --all --initlabel --disklabel=mbr

part /boot --size=10% --fstype=ext4 --label=BOOT
part /     --grow     --fstype=ext4 --label=ROOT

liveimg --url=dir:///sysimage/

shutdown

%post --erroronfail --nochroot
	set -x

	# Locate make-initrd source/build directory
	src_srv=""
	for d in /mnt/sysimage/srv /sysimage/srv /srv; do
		if [ -d "$d/features/crash" ]; then
			src_srv="$d"
			break
		fi
	done

	if [ -z "$src_srv" ]; then
		echo "ERROR: cannot locate make-initrd source directory (tried /mnt/sysimage/srv, /sysimage/srv, /srv)" >&2
		exit 1
	fi

	# Ensure cpio-stream is installed in the target rootfs
	mkdir -p /mnt/sysimage/usr/bin
	if [ -x "$src_srv/.build/dest/usr/bin/cpio-stream" ]; then
		install -m 755 "$src_srv/.build/dest/usr/bin/cpio-stream" /mnt/sysimage/usr/bin/cpio-stream
	fi

	# Ensure cpio is present on the target rootfs
	if ! [ -x /mnt/sysimage/usr/bin/cpio ] && ! [ -x /mnt/sysimage/bin/cpio ]; then
		cpio_path="$(command -v cpio || :)"
		if [ -n "$cpio_path" ]; then
			install -m 755 "$cpio_path" /mnt/sysimage/usr/bin/cpio
		fi
	fi

	# Configure capture initramfs to be automatically generated by make-initrd
	mkdir -p /mnt/sysimage/etc/initrd.mk.d
	tee /mnt/sysimage/etc/initrd.mk.d/kdump.mk <<-EOF
	IMAGEFILE = /boot/initramfs-crash.img
	AUTODETECT = none
	CRASH_ENABLE_LIVE = 0
	FEATURES = crash qemu
	CRASH_RESERVE_SIZE = 256M
	CRASH_CHECK_SIZE = error
	EOF

	# Replace /init.once with the two-phase crash test runner
	tee /mnt/sysimage/init.once <<-'EOF'
	#!/bin/sh
	set -eu

	test -d /proc && mountpoint -q /proc || mount -t proc proc /proc
	test -d /sys && mountpoint -q /sys || mount -t sysfs sysfs /sys
	test -d /dev && mountpoint -q /dev || mount -t devtmpfs dev /dev

	kver="$(uname -r)"
	raw_dev="/dev/vdb"

	echo "=== Crash Test: init.once starting ===" > /dev/console

	# Step 1: Check if the crash dump has already been captured on raw disk
	magic="$(head -c 6 "$raw_dev" 2>/dev/null || :)"

	if [ "$magic" = "CRASHT" ]; then
		echo "CRASH TEST FAIL: crash kernel rebooted without recording dump to $raw_dev (aborted loop)" > /dev/console
		exit 1
	fi

	if [ "$magic" = "070701" ]; then
		echo "=== Phase 2: Crash dump detected on $raw_dev, verifying... ===" > /dev/console

		mkdir -p /run/verify-crash
		cd /run/verify-crash

		# Extract archive from raw disk
		cpio -idmv < "$raw_dev" > /dev/console 2>&1

		if [ ! -f meta.txt ]; then
			echo "CRASH VERIFY FAIL: meta.txt missing from cpio archive" > /dev/console
			exit 1
		fi
		if [ ! -f dmesg.txt.gz ]; then
			echo "CRASH VERIFY FAIL: dmesg.txt.gz missing from cpio archive" > /dev/console
			exit 1
		fi

		echo "--- meta.txt content ---" > /dev/console
		cat meta.txt > /dev/console

		if ! grep -q "^CRASHED_KERNEL: ." meta.txt; then
			echo "CRASH VERIFY FAIL: meta.txt does not contain non-empty CRASHED_KERNEL" > /dev/console
			exit 1
		fi
		if ! grep -q "^CRASHED_OSRELEASE: ." meta.txt; then
			echo "CRASH VERIFY FAIL: meta.txt does not contain non-empty CRASHED_OSRELEASE" > /dev/console
			exit 1
		fi
		if ! grep -q "^CRASH_DATE: ." meta.txt; then
			echo "CRASH VERIFY FAIL: meta.txt does not contain non-empty CRASH_DATE" > /dev/console
			exit 1
		fi

		echo "--- dmesg tail ---" > /dev/console
		zcat dmesg.txt.gz | tail -n 20 > /dev/console

		echo "CRASH VERIFY SUCCESS: Valid dump and metadata collected!" > /dev/console
		echo "IT WORKS!" > /dev/console
		sync
		poweroff -f || halt -f
		exit 0
	fi

	# Step 2: Phase 1 - No dump yet, prepare kexec and trigger crash
	echo "=== Phase 1: Preparing kexec crashkernel and triggering panic... ===" > /dev/console

	if ! grep -q "crashkernel=" /proc/cmdline; then
		echo "CRASH TEST FAIL: crashkernel= missing from /proc/cmdline" > /dev/console
		exit 1
	fi

	vmlinuz="/boot/vmlinuz-$kver"
	[ -f "$vmlinuz" ] || vmlinuz="$(find /boot/ -type f -name 'vmlinuz*' 2>/dev/null | head -n 1)"
	if [ -z "$vmlinuz" ] || [ ! -f "$vmlinuz" ]; then
		echo "CRASH TEST FAIL: vmlinuz kernel image not found in /boot" > /dev/console
		exit 1
	fi

	initrd="/boot/initramfs-crash.img"
	if [ ! -f "$initrd" ]; then
		echo "CRASH TEST FAIL: $initrd not found in /boot" > /dev/console
		exit 1
	fi

	echo "Loading capture kernel: $vmlinuz with initrd: $initrd..." > /dev/console
	kexec -p "$vmlinuz" \
		--initrd="$initrd" \
		--append="console=ttyS0,115200n8 rd.crash.report=dump rd.crash.raw=$raw_dev rd.crash.exit=reboot"

	loaded="$(cat /sys/kernel/kexec_crash_loaded 2>/dev/null || echo 0)"
	if [ "$loaded" != "1" ]; then
		echo "CRASH TEST FAIL: kexec crash kernel failed to load (status: $loaded)" > /dev/console
		exit 1
	fi

	echo "=== kexec crash kernel successfully loaded, triggering panic via sysrq-c ===" > /dev/console
	printf 'CRASHT_PHASE1\n' > "$raw_dev"
	sync

	echo 1 > /proc/sys/kernel/sysrq
	echo c > /proc/sysrq-trigger

	sleep 10
	echo "CRASH TEST FAIL: panic trigger did not crash kernel" > /dev/console
	exit 1
	EOF
	chmod 755 /mnt/sysimage/init.once
%end
