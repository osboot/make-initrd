# /etc/mdev.conf - Configuration for BusyBox mdev
# SPDX-License-Identifier: GPL-3.0-or-later

# Autoload kernel modules based on MODALIAS
-$MODALIAS=.* 0:0 660 @modprobe -b -q "$MODALIAS"

# Block device rules: persistent storage symlinks, device-mapper, and cdrom
-(sd[a-z].*|vd[a-z].*|nvme.*|mmcblk.*|hd[a-z].*|sr[0-9]*|xvd[a-z].*|loop[0-9].*|md[0-9].*|dm-[0-9]*|pmem.*|nbd.*|dasd.*|cciss.*|zd[0-9].*|rbd.*|ublkb.*) 0:0 660 */lib/mdev/persistent-storage
